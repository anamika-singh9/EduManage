{% extends 'base.html' %}
{% load static %}
{% block body %}
<div class="row"><div class="col-sm-12 bg-danger" style="height: 5px;"></div></div>
<div class="row">
    <div class="col-sm-12" id="aboutimg">
        <div class="col-sm-5 text-white mt-5 px-5">
            <a href="{% url 'index' %}">HOME</a>
            <small> / Video Gallery</small>
            <h3><u class="text-primary"><span class="text-white">Video Gallery</span></u></h3>
        </div>
    </div>
</div>
<div class="row mt-5 mb-5">
    <div class="col-sm-10 mx-auto">

        <h2>VIDEO GALLERY</h2>
        <div class="row">
        {% for v in videos %}
            <div class="col-md-6 mb-4"><div class="ratio ratio-16x9">
                <iframe src="https://www.youtube-nocookie.com/embed/{{v.youtube_id}}" title="{{v.title}}" allowfullscreen loading="lazy"></iframe></div>
                <h6 class="mt-2">{{v.title}}</h6></div>
        {% empty %}<p class="text-muted">No videos have been added yet.</p>{% endfor %}
        </div>

    </div>
</div>
{% endblock %}
