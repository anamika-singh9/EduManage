{% extends 'base.html' %}
{% load static %}
{% block body %}
<div class="row mt-5 pb-5">
    <h1 class="text-center">Contact Us</h1>
    <div class="row mx-auto">
      <div class="col-md-12 w-100">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.203985831424!2d81.53936517443803!3d26.8334635634936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399a2b20aede4817%3A0x3b01691a0b580533!2sSeth%20Anandram%20Jaipuria%20School%2C%20Ved%20Campus%2C%20Barabanki!5e0!3m2!1sen!2sin"  width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
    <div class="col-sm-10 mx-auto">
      <div class="row">
        {% if msg %}
        <div class="col-sm-12">
          <div class="alert {% if error %}alert-danger{% else %}alert-success{% endif %}" role="alert">{{msg}}</div>
        </div>
        {% endif %}
      </div>
      <div class="row">
        <div class="col-sm-6">
          <img src="" alt="">
        </div>
        <div class="col-sm-6">
            <form class="row g-3" method="post">
              {% csrf_token %}
              <div class="col-md-12">
                <label for="name" class="form-label">Name</label>
                <input name="name" type="text" class="form-control" id="name">
              </div>
              <div class="col-md-12">
                <label for="gender" class="form-label">gender</label>
                <input name="gender" type="radio" value="Male" class="form-check-input">Male
                <input name="gender" type="radio" value="Female" class="form-check-input">Female
              </div>
              <div class="col-md-12">
                <label for="address" class="form-label">Adress</label>
                <textarea name="address" class="form-control" id="address"></textarea>
              </div>
              <div class="col-md-12">
                <label for="contact" class="form-label">Contact</label>
                <input name="contact" type="number" class="form-control" id="contact">
              </div>
              <div class="col-md-12">
                <label for="emailaddress" class="form-label">Email Id</label>
                <input name="emailaddress" type="email" class="form-control" id="email">
              </div>
              <div class="col-md-12">
                <label for="enquiry" class="form-label">Enquiry</label>
                <input name="enquirytext" type="enquiry" class="form-control" id="enquiry">
              </div>
               <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>
            </form>
        </div>
      </div>
    </div>
</div>

{% endblock %}
