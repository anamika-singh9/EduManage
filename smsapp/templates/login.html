{% extends 'base.html' %}
{% load static %}
{% block body %}
<div class="row py-5" style="background:linear-gradient(to right ,rgb(74,74,214),rgb(176,58,58));">
    <div class="col-md-4 mx-auto">
      <div class="card p-3 text-center">
        <main class="form-signin w-100 m-auto">
            <form method="post" action="{% url 'logcore' %}">
              {% csrf_token %}
              <p><span ><h1><i class="fa-solid fa-users"></i></h1></span></p>
              <h1 class="h3 mb-3 fw-normal py-2">Welcome User</h1>
              {% if msg %}
              <div class="alert alert-danger" role="alert">{{msg}}</div>
              {% endif %}
              <div class="form-floating">
                <input name="userid" type="email" class="form-control" id="uid" placeholder="name@example.com" required>
                <label for="uid">Email address</label>
              </div>
              <div class="form-floating">
                <input name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                <label for="floatingPassword">Password</label>
              </div>

              <button class="btn btn-primary w-100 py-2 mt-3" type="submit">Log in </button>
            </form>
          </main>
      </div>  
    </div>
</div>
{% endblock %}
