{% extends 'studentbase.html' %}
{% load static %}
{% block student %}

<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center"> View SLM </h1>
        <table class="table">
            <tr>
                <th>S NO.</th>
                <th>Title</th>
                <th>Action</th>
            </tr>
            {% for s in slm %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{s.title}}</td>
                <td>
                    <a href="{{s.sm.url}}" target="_blank" class="btn btn-primary">Download</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">No study material available yet.</td>
            </tr>
            {% endfor %}
        </table>
        
    </div>
</div>
{% endblock %}
