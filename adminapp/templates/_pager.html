{% if page.paginator.num_pages > 1 %}
<nav><ul class="pagination justify-content-center">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?page={{page.previous_page_number}}&{{qstring}}">&laquo;</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{page.number}} of {{page.paginator.num_pages}}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?page={{page.next_page_number}}&{{qstring}}">&raquo;</a></li>{% endif %}
</ul></nav>
{% endif %}
