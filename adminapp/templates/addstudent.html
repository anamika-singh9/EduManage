{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
       <h1>Add Student</h1>
       <form method="post">
        {% csrf_token %}
        <table class="table table-bordered">
            <tr>
                <td> Enter Roll no</td>
                <td>
                    <input type="text" name="rollno" id="" class="form-control">
                </td>
            </tr>
            <tr>
                <td>Enter Name</td>
                <td>
                    <input type="text" name="name" class="form-control" placeholder="Enter Name">
                </td>
            </tr>
            <tr>
                <td>Fathers's Name</td>
                <td>
                    <input type="text" name="fname" class="form-control" >
                </td>
            </tr>
            <tr>
                <td>Mother Name</td>
                <td>
                    <input type="text" name="mname" class="form-control">
                </td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male" class=""/>Male
                    <input type="radio" name="gender" value="Female" class=""/>Female
                </td>
            </tr>
            <tr>
                <td>D.O.B</td>
                <td>
                    <input type="text" name="dob" class="form-control" placeholder="Enter D.O.B"/>
                </td>
            </tr>
            <tr>
                <td>Contact no</td>
                <td>
                    <input type="number" name="contact" class="form-control" placeholder="Phone no">
                </td>
            </tr>
            <tr>
                <td>EmailAdress</td>
                <td>
                    <input type="email" name="emailaddress" class="form-control">
                </td>
            </tr>
            <tr>
                <td>Class Teacher</td>
                <td>
                    <select name="sclass" class="form-control">
                        <option value="">Select class of Student</option>
                        {% for c in cl %}
                        <option value="{{c.class_name}}">{{c.class_name}}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
            <tr>
                <td>Address</td>
                <td>
                    <input type="text" name="address" class="form-control">
                </td>
            </tr>
            <tr>
                <td>Paid Fees</td>
            <td>
                <input type="number" name="feepaid" class="form-control">
            </td>
            </tr>
            <tr>
                <td>Deu Fees</td>
            <td>
                <input type="number" name="duefee" class="form-control">
            </td>
            </tr>
            <tr>
                <td>Password</td>
                <td>
                    <input type="password" name="password" class="form-control">
                </td>
            </tr>
            <tr>
                <td colspan="2" class="text-center">
                    <button class="btn btn-success" type="submit">Add</button>
                </td>
            </tr>
        </table>
    </form>
    </div>
</div>
{%  endblock %}
