{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Add Class</h1>
        <form action="" method="post">
            {% csrf_token %}
            <table class="table">
                <tr>
                    <td>Enter Name</td>
                    <td>
                        <input name="class_name" type="text" class="form-control"/>
                    </td>
                    </tr>
                    <tr>
                        <td>Seats</td>
                        <td>
                            <input type="number" name="seats" class="form-control"/>
                        </td>
                    </tr>
                    <tr>
                        <td>Room no.</td>
                        <td>
                            <input type="text" name="roomno" class="form-control"/>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="text-center">
                            <button type="submit" class="btn btn-success px-4 ">Add</button>
                        </td>
                    </tr>
            </table>
        </form>
    </div>
</div>
{%  endblock %}
