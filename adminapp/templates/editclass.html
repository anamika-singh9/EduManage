{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Edit Class</h1>
        <form action="{% url 'adminapp:updateclass' %}" method="post">
            {% csrf_token %}
            <table class="table">
                <tr>
                   <td>Class Id</td>
                   <td>
                    <input name="cid" type="number" value="{{ecl.cid}}" class="form-control" readonly/>
                   </td> 
                </tr>
                <tr>
                    <td>Class Name</td>
                    <td>
                        <input name="class_name" type="text" value="{{ecl.class_name}}" class="form-control"/>
                    </td>
                    </tr>
                    <tr>
                        <td> No of Seats</td>
                        <td>
                            <input type="number" name="seats" value="{{ecl.seats}}" class="form-control"/>
                        </td>
                    </tr>
                    <tr>
                        <td>Room no.</td>
                        <td>
                            <input type="text" name="roomno" value="{{ecl.roomno}}" class="form-control"/>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="text-center">
                            <button type="submit" class="btn btn-success px-4 ">SAVE</button>
                        </td>
                    </tr>
            </table>
        </form>
    </div>
</div>
{%  endblock %}
