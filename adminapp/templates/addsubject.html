{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
        <h1 class="text-center">Add Subject</h1>
        <form action="" method="post">
            {% csrf_token %}
            <table class="table">
                <tr>
                    <td>Subject Name</td>
                    <td>
                        <input type="text" name="subject_name" id="" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Subject Class</td>
                    <td>
                        <select name="sclass" id="" class="form-control">
                            <option value="">---select class----</option>
                            {% for c in cl %}
                            <option value="{{c.class_name}}">{{c.class_name}}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Enter Book Name</td>
                    <td>
                        <input type="text" name="book" class="form-control">
                    </td>
                </tr>
                <tr>
                    <td>Enter Subject Teacher</td>
                    <td>
                        <select name="steacher" class="form-select" required>{% for t in teachers %}<option>{{t.name}}</option>{% endfor %}</select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="text-center">
                        <button type="submit" class="btn btn-success">Add Subject</button>
                    </td>
                </tr>
            </table>
        </form>

    </div>
</div>
{% endblock %}
