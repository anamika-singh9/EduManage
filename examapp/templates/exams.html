{% extends 'teacherbase.html' %}
{% block teacher %}
<div class="row"><div class="col-sm-10 mx-auto">
  <h1 class="text-center">Exams</h1>
  <form method="post" class="row g-2 my-3">{% csrf_token %}
    <div class="col"><input name="name" class="form-control" placeholder="Exam name (e.g. Half Yearly 2026)" required></div>
    <div class="col"><input type="date" name="exam_date" class="form-control" required></div>
    <div class="col-auto"><button class="btn btn-primary">Create Exam</button></div>
  </form>
  <table class="table"><tr><th>Exam</th><th>Class</th><th>Date</th><th>Action</th></tr>
  {% for e in exams %}<tr><td>{{e.name}}</td><td>{{e.sclass}}</td><td>{{e.exam_date}}</td>
    <td><a class="btn btn-sm btn-success" href="{% url 'examapp:manage_results' e.id %}">Enter Results</a></td></tr>
  {% empty %}<tr><td colspan="4" class="text-center">No exams yet.</td></tr>{% endfor %}
  </table>
</div></div>
{% endblock %}
